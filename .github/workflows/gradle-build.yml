name: Build and Publish

on:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - 'helm/**'
      - 'docker-compose/**'
      - 'structures-js/**'
      - 'webdocs/**'
      - 'website/**'
  pull_request:
    branches:
      - develop
    paths-ignore:
      - 'helm/**'
      - 'docker-compose/**'
      - 'structures-js/**'
      - 'webdocs/**'
      - 'website/**'

concurrency:
  group: gradle-build-${{ github.event.pull_request.number || github.ref }}
  # A main run publishes immutable release artifacts for ~1 h; cancelling it mid-way
  # leaves some modules live and the rest unpublished, so main runs queue instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gradle_build_and_publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          gpg-private-key: ${{ secrets.GPG_KEY_NEW }}
          gpg-passphrase: ${{ secrets.GPG_KEY_PASS_NEW }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradle.properties holds the plain version. Effective version by event:
      #   PR           -> <base>-pr<PR#>.<sha>  (pullable image to test the PR)
      #   develop push -> <base>-SNAPSHOT       (development build)
      #   main push    -> <base>                (release, published as-is)
      - name: Determine build version
        id: ver
        run: |
          BASE=$(grep '^structuresVersion=' gradle.properties | cut -d= -f2)
          BASE=${BASE%-SNAPSHOT}
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
            VERSION="${BASE}-pr${{ github.event.pull_request.number }}.${SHORT_SHA}"
            echo "gradle_args=-PstructuresVersion=${VERSION}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            VERSION="${BASE}"
            echo "gradle_args=-Prelease" >> "$GITHUB_OUTPUT"
          else
            VERSION="${BASE}-SNAPSHOT"
            echo "gradle_args=" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION}"

      - name: Build with Gradle
        id: gradle_build
        continue-on-error: true
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
        run: ./gradlew build ${{ steps.ver.outputs.gradle_args }}

      - name: Publish to Maven Central with JReleaser
        if: ${{ github.event_name == 'push' && steps.gradle_build.outcome == 'success' }}
        run: ./gradlew publish ${{ steps.ver.outputs.gradle_args }} && ./gradlew jreleaserDeploy --info ${{ steps.ver.outputs.gradle_args }}
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_TOKEN_USERNAME }}
          JRELEASER_MAVENCENTRAL_TOKEN: ${{ secrets.MAVEN_TOKEN_PASSWORD }}
          JRELEASER_NEXUS2_USERNAME: ${{ secrets.MAVEN_TOKEN_USERNAME }}
          JRELEASER_NEXUS2_TOKEN: ${{ secrets.MAVEN_TOKEN_PASSWORD }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_KEY_NEW }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_KEY_PASS_NEW }}

      # Fork and dependabot PRs do not receive the Docker Hub secrets, so only
      # publish images for pushes and same-repo PRs.
      - name: Publish to Docker Hub
        if: ${{ steps.gradle_build.outcome == 'success' && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        run: ./gradlew bootBuildImage --publishImage ${{ steps.ver.outputs.gradle_args }}
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Setup pnpm for e2e dependencies
        if: ${{ steps.gradle_build.outcome == 'success' }}
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js for e2e dependencies
        if: ${{ steps.gradle_build.outcome == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            structures-js/structures-api/pnpm-lock.yaml
            structures-js/structures-cli/pnpm-lock.yaml

      - name: Build structures-api (for e2e link)
        if: ${{ steps.gradle_build.outcome == 'success' }}
        working-directory: structures-js/structures-api
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build structures-cli (for e2e link)
        if: ${{ steps.gradle_build.outcome == 'success' }}
        working-directory: structures-js/structures-cli
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Run E2E Tests
        id: run_e2e_tests
        continue-on-error: true
        env:
          # Shell env overrides the gradle.properties env-file in compose
          # interpolation, so e2e pulls the image this run just published
          structuresVersion: ${{ steps.ver.outputs.version }}
        run: |
          cd structures-js/structures-e2e
          gradle pnpmInstall
          gradle pnpmTest

      - name: Merge Test Results
        run: |
          mkdir -p allure-results
          cp -r */build/allure-results/* allure-results/ || true
          cp -r structures-js/*/allure-results/* allure-results/ || true

      # The report is built in its own job below, so a problem there can't skip the build, tests or
      # publishing
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Check If Failure
        if: ${{ steps.gradle_build.outcome == 'failure' || steps.run_e2e_tests.outcome == 'failure' }}
        run: |
          if [ "${{ steps.gradle_build.outcome }}" == "failure" ]; then
            echo "Gradle Build failed."
          fi

          if [ "${{ steps.run_e2e_tests.outcome }}" == "failure" ]; then
            echo "E2E Tests failed."
          fi

          # Optionally mark the job as failed
          exit 1

  test_report:
    name: Test Report
    needs: gradle_build_and_publish
    # Published for failing runs too, which is when the report matters most
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Get Allure history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      # The Allure CLI from Maven Central, retried, as a rate-limited or failed download is the
      # one thing here that can fail on its own
      - name: Install Allure
        env:
          ALLURE_VERSION: 2.44.0
          ALLURE_SHA256: 7021a90828c00cd6ec992027cce48e8a94bd87fad43d0c2dcac4795cadc178d7
        run: |
          curl -fsSL --retry 5 --retry-delay 30 --retry-all-errors -o "$RUNNER_TEMP/allure.tgz" \
            "https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/${ALLURE_VERSION}/allure-commandline-${ALLURE_VERSION}.tgz"
          echo "${ALLURE_SHA256}  $RUNNER_TEMP/allure.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/allure.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      # What simple-elf/allure-report-action did, without its Docker image: carry the trend history over
      # from gh-pages, generate the report, and lay it out under allure/<run number> for publishing. The
      # earlier reports stay, as the deploy keeps the files already on gh-pages.
      - name: Generate Allure report
        env:
          PAGES_URL: https://mindsignited.github.io/structures/allure
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -d gh-pages/allure/last-history ]; then
            cp -r gh-pages/allure/last-history/. allure-results/history
          fi
          cat > allure-results/executor.json <<EOF
          {"name":"GitHub Actions","type":"github","reportName":"Allure Report with history",
           "url":"${PAGES_URL}","reportUrl":"${PAGES_URL}/${RUN_NUMBER}",
           "buildUrl":"${RUN_URL}","buildName":"GitHub Actions Run #${RUN_ID}","buildOrder":"${RUN_NUMBER}"}
          EOF
          allure generate --clean allure-results -o allure-report

          mkdir -p allure-history/allure
          cp -r allure-report/. "allure-history/allure/${RUN_NUMBER}"
          cp -r allure-report/history/. allure-history/allure/last-history
          echo "<!DOCTYPE html><meta charset=\"utf-8\"><meta http-equiv=\"refresh\" content=\"0; URL=${PAGES_URL}/${RUN_NUMBER}/index.html\"><meta http-equiv=\"Pragma\" content=\"no-cache\"><meta http-equiv=\"Expires\" content=\"0\">" > allure-history/allure/index.html

      - name: Deploy report to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages
          keep_files: true

      - name: Add status to Commit
        uses: guibranco/github-status-action-v2@v1.1.13
        with:
          authToken: ${{ secrets.GITHUB_TOKEN }}
          context: 'Test Report'
          description: 'Passed'
          state: 'success'
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          target_url: https://mindsignited.github.io/structures/allure/${{ github.run_number }}
