# Spring Boot 3.x shipped this resource inside spring-boot-test; Spring Boot 4 dropped it.
# Without it docker-java falls back to its built-in default API version (1.32), which modern
# Docker Engines reject with "client version 1.32 is too old. Minimum supported API version is 1.44",
# and Testcontainers then reports "Could not find a valid Docker environment".
api.version=1.44
