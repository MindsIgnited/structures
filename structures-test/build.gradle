plugins {
	id 'org.kinotic.java-library-conventions'
	id 'io.freefair.lombok'
}

dependencies {

	implementation project(':structures-api')
	implementation project(':structures-auth')
	implementation project(':structures-core')
	implementation project(':structures-sql')

	implementation 'org.springframework.boot:spring-boot-autoconfigure'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	implementation 'io.jsonwebtoken:jjwt-api'
	implementation 'io.jsonwebtoken:jjwt-impl'
	implementation 'io.jsonwebtoken:jjwt-jackson'

	implementation "com.github.ben-manes.caffeine:caffeine"

    // using api directly 
    implementation "jakarta.annotation:jakarta.annotation-api"

	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
    // Jackson 2, test scope only: JsonPathBenchmark measures the pre-upgrade path against it as the
    // baseline. Nothing in Structures uses Jackson 2; it is on the runtime classpath anyway as a
    // transitive of jjwt, swagger-core and the OpenAI client.
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    // The libraries whose linkage against the versions the BOMs select is pinned by tests
    testImplementation 'io.vertx:vertx-core'
    testImplementation 'io.vertx:vertx-web-graphql'
    testImplementation 'com.graphql-java:graphql-java'
    testImplementation 'io.swagger.core.v3:swagger-core-jakarta'
    testImplementation 'io.swagger.core.v3:swagger-models-jakarta'
    // Testcontainers 2 at the version the Boot BOM manages. Pinned by TestcontainersDockerApiTest.
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-elasticsearch'
    testImplementation 'com.github.dasniko:testcontainers-keycloak'
}

test {
    systemProperty 'spring.profiles.active', 'test'
    // some tests take longer
    timeout = Duration.ofMinutes(10)
}
