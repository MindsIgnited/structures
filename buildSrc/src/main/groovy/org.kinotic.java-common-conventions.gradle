plugins {
    // Apply the java Plugin to add support for Java.
    id 'java'
    id 'io.spring.dependency-management'
}

group 'org.kinotic'

// gradle.properties holds the plain version (e.g. 3.5.8). Development builds get
// -SNAPSHOT appended automatically; CI passes -Prelease on main to publish the
// version as-is (stripping a leftover -SNAPSHOT so the guard and the build agree),
// and PR builds pass an explicit -PstructuresVersion override.
def effectiveVersion = "${structuresVersion}"
if (hasProperty('release')) {
    effectiveVersion = effectiveVersion - '-SNAPSHOT'
} else if (!effectiveVersion.contains('-')) {
    effectiveVersion += '-SNAPSHOT'
}
version effectiveVersion
sourceCompatibility = '21'

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()

    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }

    maven {
        name = 'Central Portal Snapshots'
        url = uri('https://central.sonatype.com/repository/maven-snapshots/')
    }
}

// Define configuration for AspectJ agent
configurations {
    agent {
        canBeResolved = true
        canBeConsumed = true
    }
}

// The Boot BOM manages Netty below what Vert.x was built against (vertx-dependencies <netty.version>),
// and the gap is a NoSuchMethodError on the event loop the first time a client upgrades to HTTP/2 -
// which nothing speaking HTTP/1.1 ever sees. Overriding the BOM's property keeps the whole Netty set
// consistent at the version Vert.x asks for. Pinned by HttpTransportTest.
//
// Vert.x's JSON codec has the same shape against Jackson 2 (vertx-dependencies <jackson2.version>
// against Boot's jackson-2-bom), one patch apart rather than seven; left to the BOM and pinned by
// VertxJsonCodecTest so a widening gap shows up there and not in production.
ext['netty.version'] = nettyVersion

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        mavenBom "io.opentelemetry:opentelemetry-bom:${otelBomVersion}"
        mavenBom "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:${otelInstrumentationBomVersion}"
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
    dependencies {
        dependency "co.elastic.clients:elasticsearch-java:${elasticClientVersion}"

        // Ahead of the Boot BOM: vertx-web-graphql is compiled against a newer graphql-java than Boot
        // manages, and federation and the extended scalars follow it. Pinned by GraphQlJsonObjectAdapterTest.
        dependency "com.graphql-java:graphql-java:${graphQlJavaVersion}"
        dependency "com.graphql-java:graphql-java-extended-scalars:${graphQlJavaExtendedScalarsVersion}"
        dependency "com.apollographql.federation:federation-graphql-java-support:${graphQlFederationJvmVersion}"

        dependency "org.apache.commons:commons-lang3:${apacheCommonsLangVersion}"
        dependency "org.apache.commons:commons-text:${apacheCommonsTextVersion}"

        dependency "commons-io:commons-io:${commonsIoVersion}"

        dependency "io.vertx:vertx-web:${vertxVersion}"
        dependency "io.vertx:vertx-web-graphql:${vertxVersion}"
        dependency "io.vertx:vertx-web-client:${vertxVersion}"
        dependency "io.vertx:vertx-health-check:${vertxVersion}"

        dependency "org.apache.commons:commons-compress:${commonsCompressVersion}"

        dependency "org.apache.ignite:ignite-core:${igniteVersion}"
        dependency "org.apache.ignite:ignite-kubernetes:${igniteVersion}"
        dependency "org.apache.ignite:ignite-spring:${igniteVersion}"


        dependency "org.elasticsearch.client:elasticsearch-rest-client:${elasticClientVersion}"

        // The jakarta flavour: the javax one names javax.validation / javax.xml.bind classes nothing on a
        // Boot 4 classpath provides. Pinned by SwaggerModelResolverTest.
        dependency "io.swagger.core.v3:swagger-core-jakarta:${swaggerCoreVersion}"
        dependency "io.swagger.core.v3:swagger-models-jakarta:${swaggerCoreVersion}"

        dependency "com.github.dasniko:testcontainers-keycloak:${testcontainersKeycloakVersion}"

        dependency "org.kinotic:continuum-core:${continuumVersion}"
        dependency "org.kinotic:continuum-core-vertx:${continuumVersion}"
        dependency "org.kinotic:continuum-gateway:${continuumVersion}"
        dependency "org.kinotic:continuum-idl:${continuumVersion}"

        // JWT and OIDC dependencies
        dependency "io.jsonwebtoken:jjwt-api:${jsonwebtokenVersion}"
        dependency "io.jsonwebtoken:jjwt-impl:${jsonwebtokenVersion}"
        dependency "io.jsonwebtoken:jjwt-jackson:${jsonwebtokenVersion}"
    }
}

dependencies {
    implementation 'org.apache.commons:commons-lang3'
    implementation 'org.apache.commons:commons-text'

    implementation 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations'

    implementation 'ch.qos.logback:logback-core'
    implementation 'ch.qos.logback:logback-classic'

    // Add aspectj weaver dependency for use during tests
    agent "org.aspectj:aspectjweaver:$aspectJVersion"

    testImplementation platform("io.qameta.allure:allure-bom:$allureVersion")
    testImplementation "io.qameta.allure:allure-junit5"
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    environment("JAVA_TOOL_OPTIONS", "-javaagent:${configurations.agent.singleFile} --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}